[package]
name = "plato-config"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Configuration management for PLATO rooms — parse, validate, merge"
repository = "https://github.com/SuperInstance/plato-config"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
