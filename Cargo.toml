[package]
name = "plato-config"
version = "0.1.0"
edition = "2021"
description = "Configuration management system for OpenConstruct"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
notify = { version = "6", optional = true }

[features]
default = ["watch"]
watch = ["notify"]
